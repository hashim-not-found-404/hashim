[package]
name = "accounting_ui"
version = "0.1.0"
authors = ["hashem"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
my_core = { workspace = true }
adapters = { workspace = true }
cache_rusqlite = { workspace = true }

dioxus = { version = "0.7.9", features = ["router"] }
dioxus-logger = { workspace = true }


[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
