[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
accounting_engine = { path = "./crates/accounting_engine" }
adapters = { path = "./crates/adapters" }
cache = { path = "./crates/cache" }
database = { path = "./crates/database" }
my_core = { path = "./crates/my_core" }

actix-cors = "0.7.1"
actix-web = { version = "4.14.0", features = ["rustls-0_23"] }
actix-ws = "0.4.0"
argon2 = "0.5.3"
chrono = "0.4.45"
deadpool-postgres = "0.14.1"
derive_more = { version = "2.1.1", features = ["full"] }
dioxus = { version = "0.7.9", features = ["router"] }
dioxus-logger = "0.7.9"
futures = "0.3.32"
futures-util = "0.3.32"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
gloo-net = "0.7.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
postcard = { version = "1.1.3", features = ["alloc"] }
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust_decimal = { version = "1.42.1", features = ["db-tokio-postgres"] }
rustls = "0.23.42"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["macros", "rt"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-serde_json-1"] }
tokio-tungstenite = "0.29.0"
uuid = { version = "1.24.0", features = ["v7", "serde", "js"] }
wasm-bindgen-futures = "0.4.76"

[profile.dev]
opt-level = 0
