[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.dependencies]
# app agnostic
accounting_engine = { path = "./crates/accounting_engine" }
infrastructure    = { path = "./crates/infrastructure" }
utility           = { path = "./crates/utility" }
utility_ui        = { path = "./crates/utility_ui" }

# internal use cases agnostic
cache    = { path = "./crates/cache" }
database = { path = "./crates/database" }
kernel   = { path = "./crates/kernel" }
patterns = { path = "./crates/patterns" }
server   = { path = "./crates/server" }

# use cases
use_case_create_account             = { path = "./crates/use_case_create_account" }
use_case_create_account_for_branch  = { path = "./crates/use_case_create_account_for_branch" }
use_case_create_branch              = { path = "./crates/use_case_create_branch" }
use_case_create_company             = { path = "./crates/use_case_create_company" }
use_case_create_journal_entry       = { path = "./crates/use_case_create_journal_entry" }
use_case_error_handler              = { path = "./crates/use_case_error_handler" }
use_case_get_all_accounts           = { path = "./crates/use_case_get_all_accounts" }
use_case_get_companies_and_branches = { path = "./crates/use_case_get_companies_and_branches" }
use_case_home                       = { path = "./crates/use_case_home" }
use_case_select_default_company     = { path = "./crates/use_case_select_default_company" }
use_case_sign_in                    = { path = "./crates/use_case_sign_in" }
use_case_sign_up                    = { path = "./crates/use_case_sign_up" }

# external in the domain
anyhow      = "1.0.104"
dyn-clone   = "1.0.20"
heck        = "0.5.0"
paste       = "1.0.15"
proc-macro2 = "1.0.107"
quote       = "1.0.47"
schemars    = "1.2.3"
serde       = { features = ["derive"], version = "1.0.229" }
syn         = "3.0.9"
typetag     = "0.2.23"

# external out the domain
actix-cors               = "0.7.2"
actix-web                = { features = ["rustls-0_23"], version = "4.18.1" }
actix-ws                 = "0.4.0"
argon2                   = "0.6.0"
axum                     = "0.8"
chrono                   = "0.4.45"
console_error_panic_hook = "0.1.7"
deadpool-postgres        = "0.14.2"
derive_more              = { features = ["full"], version = "2.1.1" }
dioxus                   = { features = ["router"], version = "0.7.10" }
futures                  = "0.3.34"
futures-util             = "0.3.34"
getrandom                = { features = ["wasm_js"], version = "0.4.3" }
gloo-net                 = "0.7.0"
gloo-timers              = { features = ["futures"], version = "0.4.0" }
jsonwebtoken             = { features = ["rust_crypto"], version = "11.1.0" }
postcard                 = { features = ["alloc"], version = "1.1.3" }
regex                    = "1.13.1"
rmcp                     = { features = ["server", "transport-streamable-http-server", "transport-streamable-http-server-session"], version = "3.7" }
rusqlite                 = { features = ["bundled"], version = "0.41.0" }
rust_decimal             = { features = ["db-tokio-postgres"], version = "1.43.0" }
rustls                   = "0.23.46"
rustls-pemfile           = "2.2.0"
serde_json               = "1.0.154"
tokio                    = { features = ["macros", "rt", "sync", "time"], version = "1.54.1" }
tokio-postgres           = { features = ["with-serde_json-1", "with-uuid-1"], version = "0.7.18" }
tokio-tungstenite        = "0.30.0"
tracing                  = "0.1.44"
tracing-subscriber       = "0.3.23"
tracing-web              = "0.1.3"
uuid                     = { features = ["js", "serde", "v7"], version = "1.29.0" }
wasm-bindgen-futures     = "0.4.79"

[profile.dev.package."*"]
debug     = true
opt-level = 0

[profile.test.package."*"]
opt-level = 0
