[workspace]
resolver = "2"
members = [
    "accounting_engine",
    "adapters",
    "cache",
    "database",
    "my_core",
    "server",
    "ui",
]

[workspace.dependencies]
accounting_engine = { path = "./accounting_engine" }
adapters = { path = "./adapters" }
cache = { path = "./cache" }
database = { path = "./database" }
derive_more = { version = "2.1.1", features = ["full"] }
dioxus-logger = "0.7.9"
futures-util = "0.3.32"
my_core = { path = "./my_core" }
rustls = "0.23.42"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = "1.53.0"
uuid = { version = "1.24.0", features = ["v7", "serde", "js"] }

[profile.dev]
opt-level = 0
