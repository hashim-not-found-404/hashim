[workspace]
resolver = "2"
members = [
    # "accounting_lib",
    "accounting_ui",
    "my_core",
    "db_client_cockroach",
    "server_actix",
    "adapters",
    "cache_surreal",
]

[workspace.dependencies]
# my crates
my_core = {path = "./my_core"}
adapters = {path = "./adapters"}
cache_surreal = {path = "./cache_surreal"}
db_client_cockroach = {path = "./db_client_cockroach"}

# ui
dioxus-logger = "0.7.4"

# web
futures = "0.3.32"
futures-util = "0.3.32"
wasm-bindgen-futures = "0.4.70"
tokio-tungstenite = "0.29.0"
gloo-timers = { version = "0.4.0" , features = ["futures"]}
gloo-net = "0.7.0"

# crypto
rustls = "0.23.35"
rustls-pemfile = "2.2.0"
argon2 = "0.5.3"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }

# encode decode
serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }

# runtime
tokio = "1.51.0"

# time
chrono = "0.4.42"

# random
getrandom = { version = "0.4.2", features = ["wasm_js"] }
uuid ={version = "1.23.0",features = ["v7","serde","js"]}

# regex
regex = "1.12.2"


paste = "1.0.15"
derive_more ={version = "2.0.1",features = ["full"]}

[profile.dev]
opt-level = 0
