# # taplo.toml
# # Apply this rule to all Cargo.toml files
# [[rule]]
# include = ["**/Cargo.toml"]
#

[formatting]
align_comments        = true  #
align_entries         = true  #
array_auto_expand     = false #
array_trailing_comma  = true  #
compact_arrays        = true
compact_inline_tables = true
crlf                  = false
inline_table_expand   = true
reorder_arrays        = true  #
reorder_inline_tables = true  #
reorder_keys          = true  #
trailing_newline      = false