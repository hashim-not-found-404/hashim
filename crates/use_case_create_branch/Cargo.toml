[package]
edition = "2024"
name    = "use_case_create_branch"
version = "0.1.0"

[features]
cache    = ["client", "dep:cache", "dep:rusqlite"]
client   = ["dep:utility_ui"]
database = ["dep:database", "dep:rust_decimal", "server"]
mcp      = ["client", "dep:serde_json", "use_case_home/mcp"]
server   = []
ui       = ["client", "dep:dioxus", "utility_ui/ui"]

[dependencies]
infrastructure = { workspace = true }
kernel         = { workspace = true }
utility        = { workspace = true }

anyhow   = { workspace = true }
schemars = { workspace = true }
serde    = { workspace = true }
typetag  = { workspace = true }

use_case_home = { optional = true, workspace = true }

cache      = { optional = true, workspace = true }
database   = { optional = true, workspace = true }
utility_ui = { optional = true, workspace = true }

dioxus       = { optional = true, workspace = true }
rusqlite     = { optional = true, workspace = true }
rust_decimal = { optional = true, workspace = true }
serde_json   = { optional = true, workspace = true }

[dev-dependencies]
tokio = { workspace = true }
