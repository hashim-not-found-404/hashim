[package]
name = "cache_surreal"
version = "0.1.0"
edition = "2024"

[dependencies]
my_core = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
surrealdb = { version = "3.1.2", features = ["kv-mem" , "kv-indxdb"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
surrealdb = { version = "3.1.2", features = ["kv-mem" , "kv-rocksdb"] }
