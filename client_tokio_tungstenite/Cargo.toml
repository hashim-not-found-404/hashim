[package]
name = "client_tokio_tungstenite"
version = "0.1.0"
edition = "2024"

[dependencies]
my_core = { workspace = true }
adapters = { workspace = true }
tokio = { workspace = true , features = ["macros","rt"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
agnostic-lite = { workspace = true, features = ["time","wasm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agnostic-lite = { workspace = true, features = ["time","tokio"] }
