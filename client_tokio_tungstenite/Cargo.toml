[package]
name = "client_tokio_tungstenite"
version = "0.1.0"
edition = "2024"

[dependencies]
my_core = { workspace = true }
impls_for_wasm = { workspace = true }

tokio-tungstenite-wasm = { workspace = true }
futures-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
agnostic-lite = { workspace = true, features = ["time","wasm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agnostic-lite = { workspace = true, features = ["time","tokio"] }
